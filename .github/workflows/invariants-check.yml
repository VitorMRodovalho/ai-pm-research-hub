name: Schema Invariants (ADR-0012 B10)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Daily at 07:00 UTC (catches drift introduced outside PR flow, e.g., direct DB edits)
    - cron: '0 7 * * *'
  workflow_dispatch:

# #1505 — ver ci.yml: cancelar em voo um job que fala com a producao deixa residuo.
concurrency:
  group: invariants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-invariants:
    runs-on: ubuntu-latest
    # #1509 — o trabalho em si leva ~5 min, mas a ESPERA pela faixa do banco corre dentro do
    # mesmo orcamento. Com `timeout-minutes: 5` o job morria esperando, e um job morto por
    # timeout do runner nao imprime a mensagem de teto estourado — volta a ser um gate que
    # nao rodou por motivo obscuro, que e o que este issue existe para eliminar.
    # Regra: timeout do job > teto de espera + trabalho. Travado no guard.
    #
    # #1724: o teto de espera subiu para 3600s (900s era menor que UM `validate` na frente),
    # e este orcamento subiu junto. 3600s de espera + 861s do pior caso medido deste job
    # (12 runs, 11/08/2026: min 39s, mediana 49s) + folga. Quem desiste primeiro continua
    # sendo a `stuck-seconds` de 1800s, que acusa fila TRAVADA em vez de fila longa.
    timeout-minutes: 70
    # #1509 — este job e `validate` (ci.yml) falam com o MESMO banco de producao e nao
    # podem se sobrepor, mas a serializacao nao usa mais o grupo `supabase-shared-db` do
    # #1505 (o nome saiu de todos os workflows, de proposito): a fila do
    # GitHub guarda um pendente por grupo e cancela o anterior quando um terceiro chega,
    # e era ESTE job que evaporava — run 30373280532, commit 1fbf630c, zero steps
    # executados, conclusion `cancelled`, sobre um commit que aplicava DDL.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/wait-for-db-lane

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run schema invariants contract test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not configured — test will skip gracefully. Configure in repo Settings → Secrets → Actions to enable live-DB drift detection."
          fi
          npm run test:contracts:db

      - name: Summarize result
        if: always()
        run: |
          echo "## Schema Invariants Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo ":warning: Test skipped — \`SUPABASE_SERVICE_ROLE_KEY\` secret not set." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To enable: repo Settings → Secrets → Actions → New secret" >> $GITHUB_STEP_SUMMARY
            echo "- \`SUPABASE_URL\` = https://ldrfrvwhxsmgaabwmaik.supabase.co" >> $GITHUB_STEP_SUMMARY
            echo "- \`SUPABASE_SERVICE_ROLE_KEY\` = (copy from Supabase dashboard)" >> $GITHUB_STEP_SUMMARY
          else
            echo ":white_check_mark: Invariants verified against live DB." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "8 invariants checked: A1/A2/A3 (role consistency), B (is_active), C (designations), D (auth_id), E (engagement/member), F (legacy_tribe_id)." >> $GITHUB_STEP_SUMMARY
            echo "See \`supabase/migrations/20260425010000_b10_schema_invariants.sql\` and ADR-0012." >> $GITHUB_STEP_SUMMARY
          fi
