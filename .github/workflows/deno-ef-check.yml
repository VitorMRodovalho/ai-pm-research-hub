# #1106 — type-check + lint the Supabase Edge Functions (Deno).
# Closes the biggest hole in the verification net: supabase/functions/** is excluded
# from the app's TypeScript strict build (tsconfig exclude) and had NO deno check/lint
# in CI — yet nucleo-mcp/index.ts is the ~300-tool authority gate.
#
# GATE STATE (step-2, 2026-07-06 — both checks now BLOCKING):
#  - `deno lint` is BLOCKING (clean at 0 problems, with two idiom-false-positive rules
#    excluded: no-explicit-any and no-import-prefix — pervasive `any` and the npm:/jsr:
#    inline specifiers are Supabase-EF idiom, not correctness).
#  - `deno check` is BLOCKING. Step-2 root-caused the ~1836 "errors" as the untyped
#    Supabase client (createClient without a Database generic → rpc() data:never +
#    args:undefined). Typing every client as <any,"public",any> (+ a handful of genuine
#    residual casts) took the whole supabase/functions/** glob to 0 type errors — WITHOUT
#    the registerTools() modularization, which does not affect the type-error count
#    (organizational only; deferred). The net is now fully closed; keep it at 0.
name: Deno EF Check

on:
  # Runs on EVERY PR (no paths filter) so the required `deno` status check always
  # reports. A path-filtered required check hangs any PR that doesn't touch the filtered
  # paths ("Expected — waiting for status"), deadlocking unrelated PRs. The job is fast
  # (~30s) and `deno lint` is clean on main, so it passes on PRs that don't touch EFs.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    # #1896 - o check das EFs NAO deve depender da arvore npm do frontend. Sem esta variavel o
    # Deno descobre o package.json da raiz e resolve TUDO que esta declarado la: medido num clone
    # limpo, o node_modules criado por este job ganhava 39 entradas de topo (astro, playwright,
    # eslint, @radix-ui...), e nenhuma Edge Function importa qualquer uma delas -- elas usam
    # especificadores `npm:`/`jsr:` inline, que o Deno resolve sozinho.
    #
    # O custo disso apareceu em 20/08/2026: `satteri@0.10.4` foi publicado declarando uma
    # optionalDependency em `@bruits/satteri-darwin-arm64@0.10.4`, versao que nunca existiu (a
    # lista pula de 0.10.3 para 0.10.5). O npm tolera (dep opcional, `os` nao casa com o runner
    # Linux); o resolvedor do Deno nao. Um check REQUIRED caiu por uma publicacao quebrada num
    # canto da arvore do site, e a fila de merge congelou.
    #
    # Amplificador: `deno-version: v2.x` flutua. O runner instalou 2.9.5, que falha; 2.5.6 passa.
    #
    # Medido com Deno 2.9.5, clone limpo e cache frio: com a variavel, node_modules cai de 39 para
    # 4 entradas, os 56 de 56 arquivos seguem sendo checados, e um TS2322 injetado de proposito
    # continua reprovando o job. A correcao nao afrouxa o portao, so para de acopla-lo ao frontend.
    env:
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # CLI flags (not a committed deno.json) so this CI config never touches how the
      # Supabase bundler deploys the functions. no-explicit-any + no-import-prefix are
      # excluded (idiom false-positives for Supabase EFs — see header).
      - name: deno lint (BLOCKING)
        run: deno lint --rules-exclude=no-explicit-any,no-import-prefix supabase/functions/

      - name: deno check (BLOCKING)
        run: deno check --node-modules-dir=auto "supabase/functions/**/*.ts"
