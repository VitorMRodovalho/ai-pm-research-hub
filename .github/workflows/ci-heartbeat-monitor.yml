name: CI Heartbeat Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  monitor_ci_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest CI Validate run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'ci.yml';
            const branch = 'main';
            const alertTitle = '[CI Monitor] CI Validate failing on main';

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch,
              event: 'push',
              status: 'completed',
              per_page: 1,
            });

            const latest = runsResponse.data.workflow_runs?.[0];
            if (!latest) {
              core.info('No completed CI Validate runs found yet.');
              core.setOutput('state', 'no_data');
              return;
            }

            core.info(`Latest CI Validate run: ${latest.html_url} (${latest.conclusion})`);
            core.setOutput('latest_run_url', latest.html_url);
            core.setOutput('latest_run_conclusion', String(latest.conclusion || ''));

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existingAlert = openIssues.data.find((issue) => issue.title === alertTitle);

            if (latest.conclusion === 'failure') {
              const body = [
                'CI heartbeat detectou falha no workflow `CI Validate` em `main`.',
                '',
                `- Run: ${latest.html_url}`,
                `- SHA: \`${latest.head_sha}\``,
                `- Trigger: \`${latest.event}\``,
                '',
                'Ação sugerida:',
                '1. Abrir logs de `validate` e `browser_guards`.',
                '2. Corrigir e fazer push incremental.',
                '3. Confirmar recuperação no próximo heartbeat.',
              ].join('\n');

              if (existingAlert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existingAlert.number,
                  body: `Falha ainda ativa no CI.\n\n${body}`,
                });
                core.info(`Updated existing CI alert issue #${existingAlert.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: alertTitle,
                  body,
                });
                core.info(`Created CI alert issue #${created.data.number}`);
              }

              core.setOutput('state', 'failing');
              return;
            }

            if (existingAlert) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingAlert.number,
                body: `Heartbeat detectou recuperação do CI Validate.\n\n- Run verde: ${latest.html_url}\n- SHA: \`${latest.head_sha}\``,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existingAlert.number,
                state: 'closed',
              });
              core.info(`Closed recovered CI alert issue #${existingAlert.number}`);
            }

            core.setOutput('state', 'healthy');


  # A2 (auditoria de CI, 21/08/2026) — os invariantes de DADO sairam do check required e passaram
  # a viver no `invariants-check`, que NAO e required. Sem este monitor a mudanca trocaria "fila
  # congelada por evento de producao" por "sinal que ninguem le", que e pior: o primeiro incomoda
  # e o segundo desaparece.
  #
  # Mesma maquina do job acima (dedup por titulo, comenta enquanto persiste, fecha ao recuperar),
  # apontada para `invariants-check.yml`. Titulo distinto de proposito: os dois alertas precisam
  # coexistir sem um sobrescrever o outro.
  monitor_invariants_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Schema Invariants run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'invariants-check.yml';
            const branch = 'main';
            const alertTitle = '[CI Monitor] Schema Invariants failing on main';

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch,
              status: 'completed',
              per_page: 1,
            });

            const latest = runsResponse.data.workflow_runs?.[0];
            if (!latest) {
              core.info('No completed Schema Invariants runs found yet.');
              core.setOutput('state', 'no_data');
              return;
            }

            core.info(`Latest Schema Invariants run: ${latest.html_url} (${latest.conclusion})`);
            core.setOutput('latest_run_url', latest.html_url);
            core.setOutput('latest_run_conclusion', String(latest.conclusion || ''));

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existingAlert = openIssues.data.find((issue) => issue.title === alertTitle);

            if (latest.conclusion === 'failure') {
              const body = [
                'CI heartbeat detectou falha no workflow `Schema Invariants` em `main`.',
                '',
                `- Run: ${latest.html_url}`,
                `- SHA: \`${latest.head_sha}\``,
                `- Trigger: \`${latest.event}\``,
                '',
                '⚠️ Este job NAO e required, entao nenhuma PR esta bloqueada por ele. E exatamente',
                'por isso que este alerta existe: ele carrega os invariantes de DADO (deriva de',
                'migration Q-C / Phase C / ADR-0097, e a Camada B do #1636), que saíram do portão',
                'required pela A2 para nao congelarem a fila com evento legitimo de producao.',
                '',
                'Ação sugerida:',
                '1. Abrir o log e identificar QUAL invariante caiu.',
                '2. Se for deriva de migration: procurar DDL aplicada sem `.sql` na main (ver #1910).',
                '3. Se for a Camada B do #1636: identificar a linha de `gate_attempts` e decidir',
                '   entre allowlist (operacao manual conhecida) ou investigacao (regressao de teste).',
              ].join('\n');

              if (existingAlert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existingAlert.number,
                  body: `Falha ainda ativa nos invariantes.\n\n${body}`,
                });
                core.info(`Updated existing invariants alert issue #${existingAlert.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: alertTitle,
                  body,
                });
                core.info(`Created invariants alert issue #${created.data.number}`);
              }

              core.setOutput('state', 'failing');
              return;
            }

            if (existingAlert) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existingAlert.number,
                body: `Heartbeat detectou recuperação dos invariantes.\n\n- Run verde: ${latest.html_url}\n- SHA: \`${latest.head_sha}\``,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existingAlert.number,
                state: 'closed',
              });
              core.info(`Closed recovered invariants alert issue #${existingAlert.number}`);
            }

            core.setOutput('state', 'healthy');

  # #2255 (13/09/2026) — o portao da A3 fica `skipped` em silencio, e ate agora nao havia como
  # perguntar a producao qual commit ela roda.
  #
  # O QUE ESTE JOB FECHA: `skipped` nao e vermelho. Nao falha check, nao abre issue, nao aparece em
  # varredura que procure `failure`. Medido em 13/09: 9 SHAs da main tiveram skip e NUNCA um success,
  # e 5 dos ultimos 12 `CI Validate` da main falharam (todos por `browser_guards`, que e a #2231).
  # Nenhum sinal dizia isso. O job acima (`monitor_ci_validate`) ve a CAUSA; este ve a CONSEQUENCIA,
  # e sao coisas diferentes: um `CI Validate` que falha e recupera sozinho deixa o alerta de causa
  # fechado e a producao atrasada do mesmo jeito, ate alguem mergear outra coisa.
  #
  # ⚠️ TRES ESTADOS, NAO DOIS, e a distincao e o coracao deste job:
  #
  #   in_sync      a rota respondeu e o SHA bate com a main   -> fecha alerta
  #   behind       a rota respondeu e o SHA NAO bate          -> alerta (apos a carencia)
  #   unreachable  nao deu para ler (rede, 5xx, timeout)      -> NAO alerta e NAO FECHA
  #
  # `unreachable` NAO PODE fechar um alerta aberto. Tratar "nao consegui medir" como "esta tudo bem"
  # e a forma mais comum de um detector mentir na direcao perigosa: bastaria o site oscilar para o
  # alerta de atraso sumir sozinho. Site fora do ar e problema de outro monitor, nao deste.
  #
  # A CARENCIA existe porque atraso curto e NORMAL: o caminho `CI Validate` (~14 min) + deploy (~2
  # min) deixa a producao legitimamente atras da main logo depois de cada merge. Sem carencia este
  # job alertaria em todo merge e viraria ruido — e alerta que quase sempre erra treina a ignorar.
  # A carencia e medida sobre a IDADE DO COMMIT da main, nao sobre o tempo desde o ultimo deploy:
  # o que interessa e "ha quanto tempo existe codigo nao publicado", nao "ha quanto tempo nao publico".
  monitor_deploy_lag:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: https://nucleoia.vitormr.dev
      GRACE_MINUTES: '60'
    steps:
      - name: Check deployed provenance against main
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const alertTitle = '[CI Monitor] Producao atrasada em relacao a main';
            const origin = process.env.SITE_ORIGIN;
            const graceMinutes = Number(process.env.GRACE_MINUTES);

            const head = await github.rest.repos.getCommit({ owner, repo, ref: 'main' });
            const headSha = head.data.sha;
            const headDate = new Date(head.data.commit.committer.date);
            const headAgeMin = (Date.now() - headDate.getTime()) / 60000;

            let state = 'unreachable';
            let deployed = null;
            let detail = '';
            try {
              const res = await fetch(`${origin}/api/version`, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(20000),
              });
              if (!res.ok) {
                detail = `HTTP ${res.status}`;
              } else {
                deployed = await res.json();
                state = deployed?.sha === headSha ? 'in_sync' : 'behind';
              }
            } catch (e) {
              detail = String(e?.message || e);
            }

            core.info(`main=${headSha} idade=${headAgeMin.toFixed(1)}min estado=${state} publicado=${deployed?.sha || '-'} ${detail}`);
            core.setOutput('state', state);

            const openIssues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existingAlert = openIssues.data.find((issue) => issue.title === alertTitle);

            // `unreachable`: nao sabemos. Nao alerta, e sobretudo NAO FECHA um alerta aberto.
            if (state === 'unreachable') {
              core.warning(`Nao foi possivel ler ${origin}/api/version (${detail}). Nenhuma conclusao tirada, alerta preservado como estava.`);
              return;
            }

            if (state === 'behind') {
              if (headAgeMin < graceMinutes) {
                core.info(`Atras da main, mas dentro da carencia (${headAgeMin.toFixed(1)}min < ${graceMinutes}min). Publicacao normal em curso.`);
                return;
              }
              const body = [
                'A producao esta servindo um commit diferente do HEAD da `main`, ha mais tempo que a carencia.',
                '',
                `- \`main\`: \`${headSha}\` (${headDate.toISOString()}, ha ${Math.round(headAgeMin)} min)`,
                `- publicado: \`${deployed?.sha || 'SEM CARIMBO'}\`${deployed?.built_at ? ` (build ${deployed.built_at})` : ''}`,
                deployed?.deploy_run_id ? `- run do deploy publicado: https://github.com/${owner}/${repo}/actions/runs/${deployed.deploy_run_id}` : '',
                '',
                'Causa mais provavel (#2255): o `CI Validate` pos-merge falhou, e o Deploy terminou como',
                '`skipped`. `skipped` nao e vermelho, entao nada mais avisa.',
                '',
                'Acao sugerida:',
                '1. `gh run list --workflow="CI Validate" --branch main --limit 5` e ver a conclusao do HEAD.',
                '2. Se foi flake (#2231), `gh run rerun <id> --failed`; o Deploy dispara de novo ao ficar verde.',
                '3. Se foi falha real, corrigir e empurrar.',
                '4. Escotilha: `workflow_dispatch` no Deploy publica sem esperar o portao.',
              ].filter(Boolean).join('\n');

              if (existingAlert) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existingAlert.number, body: `Atraso ainda ativo.\n\n${body}` });
                core.info(`Updated existing deploy-lag issue #${existingAlert.number}`);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title: alertTitle, body });
                core.info(`Created deploy-lag issue #${created.data.number}`);
              }
              return;
            }

            // in_sync
            if (existingAlert) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existingAlert.number,
                body: `Heartbeat detectou recuperacao: a producao voltou ao HEAD da main.\n\n- SHA: \`${headSha}\`${deployed?.built_at ? `\n- build: ${deployed.built_at}` : ''}`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existingAlert.number, state: 'closed' });
              core.info(`Closed recovered deploy-lag issue #${existingAlert.number}`);
            }
