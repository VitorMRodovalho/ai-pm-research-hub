name: CI Validate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# #1505 — `cancel-in-progress` era `true`, o que matava um run em VOO quando outro
# push chegava no mesmo ref. Como `validate` escreve na producao e `tx=rollback` nao
# desfaz INSERT de SECURITY DEFINER, ser morto no meio deixa fixture pela metade no
# banco. Um run de main de 2026-07-28 aparece exatamente assim (`cancelled`).
# Agora enfileira em vez de cancelar: perde-se a supersessao de pushes seguidos, o
# que num repo de dono unico custa alguns minutos e evita residuo em prod.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # A1 (auditoria de CI, #1908) — a metade HERMETICA da suite, fora da faixa do banco.
  #
  # Medido em 22/08/2026: 289 dos 611 arquivos (47%) nao referenciam `SUPABASE_URL`,
  # `SUPABASE_SERVICE_ROLE_KEY`, `SUPABASE_ANON_KEY` nem o helper `db-fetch`. Rodam em 12,6s com
  # `--test-concurrency=4`, com 3.588 asserçoes e **0 skipped** — o zero e a prova de que nenhum
  # deles esta gated por credencial, ou seja, sao mesmo hermeticos.
  #
  # Antes da A1 eles esperavam a faixa serializada do banco (p90 14m21s) e rodavam em serie, por
  # uma restricao (#1261) que nao se aplica a eles. E quando o `validate` era CANCELADO na fila
  # (7 em 198 runs, #1869), morriam junto sem executar nada.
  #
  # ⚠️ NAO adicione `wait-for-db-lane` aqui. Se um teste deste job passar a falar com o banco, o
  # conserto e move-lo para `test:behavioural` — nao trazer a espera para ca. O guard da particao
  # reprova a classificacao errada nas DUAS direcoes.
  structural:
    runs-on: ubuntu-latest
    # Sem espera de faixa: o orcamento cobre so instalar e rodar. Se este job encostar em 10 min,
    # alguma coisa deixou de ser hermetica.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sem env de Supabase, de proposito: se um teste daqui precisar de credencial, ele esta no
      # balde errado e tem de aparecer como skip, nao passar despercebido.
      - name: Run structural tests
        run: npm run test:structural

  validate:
    runs-on: ubuntu-latest
    # O recurso disputado e o BANCO DE PRODUCAO compartilhado, nao o ref: com
    # `ci-${{ github.ref }}` a main e um PR caem em grupos distintos e rodam juntos. Em
    # 2026-07-28 dois runs ocuparam a mesma janela de 7 min e falharam em subtestes
    # DIFERENTES dos MESMOS arquivos (#1294/#1297, #192, #693, invariantes R/S); o mesmo
    # commit passou sozinho no re-run. `--test-concurrency=1` (#1261) nao cobre isso:
    # serializa por PROCESSO, nao por banco.
    #
    # #1509 — a serializacao NAO usa mais o grupo de concorrencia global `supabase-shared-db`
    # que o #1505 tinha introduzido aqui (se voce veio procurar por esse nome, e por isto que
    # ele nao existe mais em workflow nenhum). A fila do GitHub
    # guarda UM pendente por grupo e CANCELA o anterior quando um terceiro chega: com dois
    # workflows no mesmo grupo, bastava um PR entrar enquanto a main rodava para o gate de
    # invariantes sumir sem executar um step sequer, e "cancelled" nao le como vermelho.
    # A espera agora acontece em runtime (`wait-for-db-lane`), com todos os jobs iniciados:
    # nenhum e descartado, e "nao rodou" deixa de ser alcancavel em silencio.
    permissions:
      contents: read
      actions: read
    # #1261: `npm test` runs DB-aware tests serially (--test-concurrency=1) to
    # kill intra-run collisions on the shared remote project. Serial ≈ 6 min
    # (vs ~2 min parallel), so bumped 10 -> 15 for margin over the full job
    # (install + lint + serial test + build + smoke).
    # #1509: a espera pela faixa do banco corre DENTRO deste orcamento, entao o teto
    # precisa cobrir espera + trabalho. Job morto por timeout do runner nao imprime a
    # mensagem de teto estourado. Travado no guard.
    #
    # #1724: o teto de espera subiu de 900s para 3600s porque 900s era MENOR que um unico
    # `validate` na frente, e este orcamento subiu junto — senao o runner mata o job antes
    # de a espera se explicar, que e o mesmo vermelho obscuro por outro caminho.
    # 3600s de espera + 1533s do pior `validate` medido (12 runs, 11/08/2026: min 674s,
    # mediana 735s) + folga. Um job de fato TRAVADO nao chega aqui: morre em 1800s pela
    # `stuck-seconds`, que e o criterio real.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6

      # #1509 — logo apos o checkout: a espera e o mais barato que este job faz, entao
      # gastar a fila aqui e melhor do que instalar dependencias para so entao esperar.
      - uses: ./.github/actions/wait-for-db-lane

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run i18n hardcoded lint gate
        run: npm run lint:i18n

      # #1205: identificador livre em <script> de .astro e ReferenceError em runtime
      # (script de .astro e modulo => strict mode). Nada type-checa esses blocos, entao
      # este no-undef e o unico gate da classe. Guard da fiacao:
      # tests/contracts/1205-client-script-undef-gate-wired.test.mjs
      - name: Run client-script undefined-identifier gate
        run: npm run lint:client-scripts

      - name: Run Unit Tests
        # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY enable DB-aware contract tests
        # (rpc-migration-coverage Q-C orphan check + drift detection). Without
        # them, the Track Q-C orphan check silently skips (p174 audit sediment).
        # Required GH secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
        # #1261: `test` script pins --test-concurrency=1 so mutating DB-aware
        # tests can't race global-invariant readers within one run (the shared
        # remote project has no per-run isolation). Do NOT reintroduce parallel
        # file execution here without an isolated tenant.
        #
        # SUPABASE_ANON_KEY habilita tests/edge-functions/ef-smoke.test.mjs, o
        # unico lugar que verifica auth de EF DEPLOYADA. Sem ela o arquivo rodava
        # e pulava em silencio — a lacuna declarada como limite nos 4 PRs do
        # #1513. Consequencia aceita (PM, 2026-07-28): esses smokes afirmam sobre
        # PRODUCAO, e merge precede deploy, entao um PR que aperta auth de EF fica
        # vermelho ate o deploy acontecer. Deploye a EF ANTES de mergear o PR.
        # Guard da fiacao: tests/contracts/1513-ef-smoke-wired-into-ci.test.mjs.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # A1 (#1908) — este job roda so a metade COMPORTAMENTAL. A estrutural (289 arquivos,
        # 12,6s, zero banco) vive no job `structural` abaixo, que nao espera a faixa. Guard da
        # particao: tests/contracts/1908-a1-particao-da-suite.test.mjs.
        run: npm run test:behavioural

      - name: Build Project
        # Mock env vars satisfy Astro/Vite build-time replacement. URL precisa
        # DNS-resolvable: workerd recente (runner image update ~2026-05-18)
        # aborta com `kj/async-io-unix.c++:1298: DNS lookup failed` em hostname
        # inexistente como `mock.supabase.co`. Issue #220 / BUG-207.C.
        env:
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:9999'
          PUBLIC_SUPABASE_ANON_KEY: 'mock-key-for-build'
        run: npm run build

      - name: Smoke Test Routes
        env:
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:9999'
          PUBLIC_SUPABASE_ANON_KEY: 'mock-key-for-build'
        run: npm run smoke:routes
        # #1725: o teto do passo virou BACKSTOP. Quem desiste primeiro sao os orcamentos internos
        # do smoke-routes.mjs (boot 90s, assercoes 120s, requisicao 15s), e cada um deles falha
        # dizendo QUAL fase travou. Os 2 minutos anteriores cobriam boot + assercoes juntos, e o
        # boot sozinho ja consumia ~18s de forma estavel — o passo morria sem nenhuma assercao ter
        # falhado, e o vermelho nao carregava sinal sobre o commit.
        timeout-minutes: 6

  browser_guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run browser guards
        # URL precisa DNS-resolvable (workerd-strict) — ver Build step acima.
        env:
          PUBLIC_SUPABASE_URL: 'http://127.0.0.1:9999'
          PUBLIC_SUPABASE_ANON_KEY: 'mock-key-for-build'
        run: ./scripts/run_browser_guards_with_retry.sh

  visual_dark_mode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      # URL precisa DNS-resolvable (workerd-strict) — ver browser_guards acima.
      PUBLIC_SUPABASE_URL: 'http://127.0.0.1:9999'
      PUBLIC_SUPABASE_ANON_KEY: 'mock-key-for-build'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run dark mode visual snapshots
        run: npm run test:visual:dark

  quality_gate:
    runs-on: ubuntu-latest
    needs: [validate, browser_guards, visual_dark_mode]
    steps:
      - name: Report gate status
        run: echo "CI quality gate passed (validate + browser_guards + visual_dark_mode)."
